spring.application.name=travel-agency-backend-template

# Load local overrides when present. This file is excluded from version control.
spring.config.import=optional:file:.env.local[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# Database credentials must be supplied through the environment.
spring.datasource.url=jdbc:mariadb://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:false}&useSSL=${DB_USE_SSL:true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Keep schema mutation explicit per environment. Local development sets this to update.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Restrict connection-pool resource usage and validate connections promptly.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}

# Application security settings. No fallback secret is intentionally provided.
app.security.remember-me-key=${APP_REMEMBER_ME_KEY}
# Login rate limit: 5 failed attempts per IP within 15 minutes, then block for 15 minutes.
app.rate-limit.login.max-attempts=${APP_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
app.rate-limit.login.window-seconds=${APP_LOGIN_RATE_LIMIT_WINDOW_SECONDS:900}
app.rate-limit.login.block-seconds=${APP_LOGIN_RATE_LIMIT_BLOCK_SECONDS:900}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# The local-only seeder is disabled unless explicitly enabled.
app.seed.enabled=${APP_SEED_ENABLED:false}
app.seed.name=${APP_SEED_NAME:Local Test Administrator}
app.seed.email=${APP_SEED_EMAIL:}
app.seed.password=${APP_SEED_PASSWORD:}
app.seed.role=${APP_SEED_ROLE:ROLE_ADMIN}

# Cloudinary connection string supplied by the deployment environment.
cloudinary.url=${CLOUDINARY_URL}
