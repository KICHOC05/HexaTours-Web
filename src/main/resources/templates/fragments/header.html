<!doctype html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<header
        id="site-header"
        class="site-header"
        th:fragment="header">

    <div class="container-shell flex h-[72px] items-center justify-between lg:h-[84px]">

        <a
                th:href="@{/} + '#inicio'"
                href="/#inicio"
                class="brand"
                aria-label="Hexa Tours, inicio">

            <img
                    th:src="@{/assets/images/hexatours_transparente.png}"
                    src="/assets/images/hexatours_transparente.png"
                    alt="Hexa Tours"
                    class="header-logo">
        </a>

        <nav
                class="hidden items-center gap-7 text-sm lg:flex"
                aria-label="Navegación principal">

            <a th:href="@{/} + '#nosotros'">Nosotros</a>
            <a th:href="@{/} + '#servicios'">Servicios</a>
            <a th:href="@{/} + '#viajes'">Viajes grupales</a>
            <a th:href="@{/} + '#preguntas'">Preguntas</a>
        </nav>

        <div class="hidden items-center gap-3 lg:flex">

            <a
                    sec:authorize="!isAuthenticated()"
                    th:href="@{/login}"
                    href="/login"
                    class="header-login">

                Iniciar sesión
            </a>

            <div
                    sec:authorize="isAuthenticated()"
                    class="flex items-center gap-3">

                <span
                        class="header-user"
                        sec:authentication="name">
                    Usuario
                </span>

                <form
                        th:action="@{/logout}"
                        action="/logout"
                        method="post">

                    <button
                            type="submit"
                            class="header-logout">

                        Cerrar sesión
                    </button>
                </form>
            </div>

            <a
                    th:href="@{/} + '#contacto'"
                    href="/#contacto"
                    class="header-cta">

                Contacto <span>↗</span>
            </a>
        </div>

        <button
                id="menu-toggle"
                class="menu-toggle lg:hidden"
                type="button"
                aria-expanded="false"
                aria-controls="mobile-menu"
                aria-label="Abrir menú">

            <span></span>
            <span></span>
        </button>
    </div>

    <div
            id="mobile-menu"
            class="mobile-menu lg:hidden"
            aria-hidden="true">

        <nav
                class="container-shell flex flex-col py-8"
                aria-label="Navegación móvil">

            <a th:href="@{/} + '#nosotros'">
                Nosotros <span>01</span>
            </a>

            <a th:href="@{/} + '#servicios'">
                Servicios <span>02</span>
            </a>

            <a th:href="@{/} + '#viajes'">
                Viajes grupales <span>03</span>
            </a>

            <a th:href="@{/} + '#preguntas'">
                Preguntas <span>04</span>
            </a>

            <a th:href="@{/} + '#contacto'">
                Contacto <span>↗</span>
            </a>

            <a
                    sec:authorize="!isAuthenticated()"
                    th:href="@{/login}"
                    href="/login"
                    class="mobile-auth-link">

                Iniciar sesión <span>↗</span>
            </a>

            <form
                    sec:authorize="isAuthenticated()"
                    th:action="@{/logout}"
                    action="/logout"
                    method="post">

                <button
                        type="submit"
                        class="mobile-auth-link mobile-auth-logout w-full text-left">

                    Cerrar sesión
                </button>
            </form>
        </nav>
    </div>

</header>

</body>
</html>
