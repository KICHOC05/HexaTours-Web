<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<header th:fragment="topbar(titulo, subtitulo)" class="admin-topbar">
    <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Abrir menú">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" x2="21" y1="6" y2="6"/><line x1="3" x2="21" y1="12" y2="12"/><line x1="3" x2="21" y1="18" y2="18"/></svg>
        </button>
        <div>
            <h1 class="topbar-title" th:text="${titulo}">Dashboard</h1>
            <p class="topbar-subtitle" th:text="${subtitulo}">Gestiona HexaTours</p>
        </div>
    </div>
    <nav class="topbar-breadcrumb">
        <a th:href="@{/dashboard}">Inicio</a>
        <span th:if="${titulo != 'Dashboard'}"> / </span>
        <span th:if="${titulo != 'Dashboard'}" th:text="${titulo}"></span>
    </nav>
</header>

</html>
