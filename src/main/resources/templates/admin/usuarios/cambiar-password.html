<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:replace="~{fragments/head :: common-head}"></th:block>
    <title>Cambiar Contraseña — HexaTours</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Italiana&family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/css/admin.css}">
</head>
<body>

<div class="admin-layout">

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div th:replace="~{admin/fragments/sidebar :: sidebar(${activePage}, ${usuario})}"></div>

    <div class="admin-main">

        <div th:replace="~{admin/fragments/topbar :: topbar('Cambiar Contraseña', 'Actualizar contraseña de usuario.')}"></div>

        <div class="admin-content">

            <div th:replace="~{admin/fragments/alerts :: alerts}"></div>

            <div class="page-header">
                <div class="page-header-text">
                    <h2 class="page-title">Cambiar Contraseña</h2>
                    <p class="page-subtitle">Establece una nueva contraseña para <strong th:text="${usuarioEditar.nombre}">Usuario</strong>.</p>
                </div>
                <a th:href="@{/dashboard/usuarios}" class="btn btn-secondary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
                    Volver
                </a>
            </div>

            <div class="form-edit-layout">
                <!-- User info card -->
                <div class="user-info-card">
                    <div class="user-info-avatar user-info-avatar-lock">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </div>
                    <h4 class="user-info-name" th:text="${usuarioEditar.nombre}">Nombre</h4>
                    <p class="user-info-email" th:text="${usuarioEditar.email}">email</p>
                    <div class="user-info-meta">
                        <span class="badge" th:classappend="${usuarioEditar.rol == 'ROLE_ADMIN'} ? 'badge-admin' : 'badge-user'"
                              th:text="${#strings.replace(usuarioEditar.rol, 'ROLE_', '')}">USER</span>
                    </div>
                </div>

                <!-- Password form card -->
                <div class="admin-form-card form-edit-card">
                    <div class="admin-form-header">
                        <div class="form-header-icon form-header-icon-lock">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </div>
                        <div>
                            <h3 th:text="'Contraseña de: ' + ${usuarioEditar.nombre}">Contraseña</h3>
                            <p class="form-page-title">Ingresa y confirma la nueva contraseña.</p>
                        </div>
                    </div>
                    <div class="admin-form-body">
                        <form th:action="@{/dashboard/usuarios/{id}/password(id=${usuarioEditar.id})}" method="post">
                            <div class="form-section">
                                <p class="form-section-label">Nueva contraseña</p>
                                <div class="form-group">
                                    <label for="passwordNueva">Contraseña nueva *</label>
                                    <input type="password" id="passwordNueva" name="passwordNueva" required minlength="8" placeholder="Mínimo 8 caracteres">
                                </div>
                                <div class="form-group">
                                    <label for="confirmar">Confirmar contraseña *</label>
                                    <input type="password" id="confirmar" name="confirmar" required minlength="8" placeholder="Repite la contraseña">
                                </div>
                            </div>

                            <div class="password-requirements">
                                <p class="form-section-label">Requisitos de la contraseña</p>
                                <ul class="password-req-list">
                                    <li>
                                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
                                        Mínimo 8 caracteres
                                    </li>
                                    <li>
                                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
                                        Ambos campos deben coincidir
                                    </li>
                                </ul>
                            </div>

                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                                    Actualizar contraseña
                                </button>
                                <a th:href="@{/dashboard/usuarios}" class="btn btn-secondary">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    (function() {
        var toggle = document.getElementById('sidebarToggle');
        var sidebar = document.getElementById('adminSidebar');
        var overlay = document.getElementById('sidebarOverlay');
        if (toggle) toggle.addEventListener('click', function() { sidebar.classList.toggle('open'); overlay.classList.toggle('show'); });
        if (overlay) overlay.addEventListener('click', function() { sidebar.classList.remove('open'); overlay.classList.remove('show'); });
    })();
</script>

</body>
</html>
