<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:replace="~{fragments/head :: common-head}"></th:block>
    <title>Paquetes — HexaTours</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Italiana&family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/css/admin.css}">
</head>
<body>

<div class="admin-layout">

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div th:replace="~{admin/fragments/sidebar :: sidebar(${activePage}, ${usuario})}"></div>

    <div class="admin-main">

        <div th:replace="~{admin/fragments/topbar :: topbar('Paquetes', 'Gestión de paquetes turísticos.')}"></div>

        <div class="admin-content">

            <div th:replace="~{admin/fragments/alerts :: alerts}"></div>

            <div class="admin-table-wrapper">
                <div class="admin-table-header">
                    <h3>Paquetes turísticos</h3>
                    <a th:href="@{/dashboard/paquetes/nuevo}" class="btn btn-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
                        Nuevo paquete
                    </a>
                </div>

                <div th:if="${#lists.isEmpty(paquetes)}" class="empty-state">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
                    <h4>No hay paquetes registrados</h4>
                    <p>Crea el primer paquete turístico.</p>
                    <a th:href="@{/dashboard/paquetes/nuevo}" class="btn btn-primary">Crear paquete</a>
                </div>

                <div th:unless="${#lists.isEmpty(paquetes)}" style="overflow-x:auto;">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Imagen</th>
                                <th>Nombre</th>
                                <th class="hide-mobile">Destino</th>
                                <th class="hide-mobile">Categoría</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${paquetes}">
                                <td>
                                    <div th:if="${p.imagenUrl != null}" style="width:48px;height:48px;border-radius:8px;overflow:hidden;background:#f0f4f5;">
                                        <img th:src="${p.imagenUrl}" alt="" style="width:100%;height:100%;object-fit:cover;">
                                    </div>
                                    <div th:unless="${p.imagenUrl != null}" style="width:48px;height:48px;border-radius:8px;background:#f0f4f5;display:flex;align-items:center;justify-content:center;">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                                    </div>
                                </td>
                                <td th:text="${p.nombre}">Nombre</td>
                                <td class="hide-mobile" th:text="${p.destino}">Destino</td>
                                <td class="hide-mobile" th:text="${p.categoria}">Categoría</td>
                                <td>
                                    <span class="badge" th:classappend="${p.activo} ? 'badge-active' : 'badge-inactive'"
                                          th:text="${p.activo} ? 'Activo' : 'Inactivo'">Activo</span>
                                </td>
                                <td>
                                    <div class="table-actions">
                                        <a th:href="@{/dashboard/paquetes/{id}/editar(id=${p.id})}" class="btn btn-secondary btn-sm">Editar</a>
                                        <form th:action="@{/dashboard/paquetes/{id}/toggle(id=${p.id})}" method="post" style="display:inline;">
                                            <button type="submit" class="btn btn-sm"
                                                    th:classappend="${p.activo} ? 'btn-secondary' : 'btn-success'"
                                                    th:text="${p.activo} ? 'Desactivar' : 'Activar'">Desactivar</button>
                                        </form>
                                        <form th:action="@{/dashboard/paquetes/{id}/eliminar(id=${p.id})}" method="post" style="display:inline;"
                                              onsubmit="return confirm('¿Eliminar este paquete?');">
                                            <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    (function() {
        var toggle = document.getElementById('sidebarToggle');
        var sidebar = document.getElementById('adminSidebar');
        var overlay = document.getElementById('sidebarOverlay');
        if (toggle) toggle.addEventListener('click', function() { sidebar.classList.toggle('open'); overlay.classList.toggle('show'); });
        if (overlay) overlay.addEventListener('click', function() { sidebar.classList.remove('open'); overlay.classList.remove('show'); });
    })();
</script>

</body>
</html>
