<!doctype html>
<html
        lang="es"
        xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <meta
            name="theme-color"
            content="#011b48">

    <title>
        Aviso de privacidad | Hexa Tours
    </title>

    <th:block th:replace="~{fragments/head :: common-head}"></th:block>

    <link
            rel="preconnect"
            href="https://fonts.googleapis.com">

    <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin>

    <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Italiana&display=swap"
            rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <link
            rel="stylesheet"
            th:href="@{/assets/css/styles.css}"
            href="/assets/css/styles.css">
</head>

<body class="bg-cream font-sans text-deep antialiased">

<th:block th:replace="~{fragments/header :: header}">
</th:block>

<main
        id="contenido"
        class="container-shell min-h-[70vh] pb-24 pt-36">

    <p class="eyebrow">
        Información legal
    </p>

    <h1 class="title-xl mt-5">
        Aviso de privacidad
    </h1>

    <div class="mt-10 max-w-4xl space-y-6 text-base leading-relaxed text-deep/70">

        <p>
            Agrega aquí el aviso de privacidad vigente de HexaTours.
        </p>
    </div>
</main>

<th:block th:replace="~{fragments/footer :: footer}">
</th:block>

<script
        th:src="@{/assets/js/app.js}"
        src="/assets/js/app.js"
        defer>
</script>

</body>
</html>
