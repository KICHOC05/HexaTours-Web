<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:replace="~{fragments/head :: common-head}"></th:block>
    <title>Registro — HexaTours</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Italiana&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/css/styles.css}">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            font-family: 'DM Sans', sans-serif;
            background: #f5f8f8;
        }
        .login-visual {
            flex: 1;
            background: linear-gradient(135deg, #011b48 0%, #012040 50%, #003366 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }
        .login-visual img { width: 220px; margin-bottom: 40px; }
        .login-visual h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            color: #fff;
            text-align: center;
            line-height: 1.3;
            max-width: 400px;
        }
        .login-visual p {
            color: rgba(255,255,255,.5);
            font-size: 14px;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .login-panel {
            width: 480px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 48px;
            background: #fff;
        }
        .login-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
        }
        .login-topbar a {
            color: #6b7b8d;
            text-decoration: none;
            font-size: 14px;
        }
        .login-topbar a:hover { color: #12aeb1; }
        .login-topbar img { height: 32px; }
        .login-card h2 {
            font-size: 24px;
            font-weight: 700;
            color: #011b48;
            margin-bottom: 8px;
        }
        .login-card > p {
            color: #6b7b8d;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .login-alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .login-alert-error { background: #fde8e8; color: #9b1c1c; border: 1px solid #f5c2c2; }
        .login-alert-success { background: #d1f5e8; color: #0d6842; border: 1px solid #a3e4c5; }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #1a2332;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e0e6ea;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            color: #1a2332;
            transition: border-color .15s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #12aeb1;
            box-shadow: 0 0 0 3px rgba(18,174,177,.15);
        }
        .btn-register {
            width: 100%;
            padding: 13px;
            background: #12aeb1;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s;
            font-family: inherit;
        }
        .btn-register:hover { background: #0388b5; }
        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #6b7b8d;
        }
        .login-footer a { color: #12aeb1; text-decoration: none; font-weight: 600; }
        .login-footer a:hover { text-decoration: underline; }
        @media (max-width: 768px) {
            .login-page { flex-direction: column; }
            .login-visual { display: none; }
            .login-panel { width: 100%; padding: 32px 24px; }
        }
    </style>
</head>
<body>

<div class="login-page">

    <div class="login-visual">
        <img th:src="@{/assets/images/fondo-letrasblancas-hexatour.png}" alt="HexaTours">
        <h2>El mundo te espera. Creemos tu cuenta.</h2>
        <p>HexaTours</p>
    </div>

    <div class="login-panel">
        <div class="login-topbar">
            <a th:href="@{/}">Volver al inicio</a>
            <img th:src="@{/assets/images/hexatours_transparente.png}" alt="HexaTours">
        </div>

        <div class="login-card">
            <h2>Crear cuenta</h2>
            <p>Regístrate para acceder a la plataforma.</p>

            <div th:if="${error}" class="login-alert login-alert-error" th:text="${error}"></div>
            <div th:if="${success}" class="login-alert login-alert-success" th:text="${success}"></div>

            <form th:action="@{/registro}" method="post">
                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">
                </div>
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required minlength="8" placeholder="Mínimo 8 caracteres">
                </div>
                <div class="form-group">
                    <label for="confirmar">Confirmar contraseña</label>
                    <input type="password" id="confirmar" name="confirmar" required minlength="8" placeholder="Repite la contraseña">
                </div>
                <button type="submit" class="btn-register">Crear cuenta</button>
            </form>

            <div class="login-footer">
                <p>¿Ya tienes cuenta? <a th:href="@{/login}">Iniciar sesión</a></p>
            </div>
        </div>
    </div>

</div>

</body>
</html>
