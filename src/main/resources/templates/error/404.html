<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Página no encontrada | Hexa Tours</title>
    <link rel="icon" type="image/png" th:href="@{/assets/images/favicon-32x32.png}">
    <style>
        :root {
            --deep: #011b48;
            --sky: #12aeb1;
            --coral: #f57f1e;
            --cream: #f7fafb;
        }

        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--cream);
            background: var(--deep);
            font-family: Arial, sans-serif;
        }

        .error-card {
            width: min(100%, 560px);
            padding: clamp(32px, 8vw, 64px);
            text-align: center;
            border: 1px solid rgba(255,255,255,.16);
            border-radius: 24px;
            background: rgba(255,255,255,.06);
            box-shadow: 0 24px 70px rgba(0,0,0,.22);
        }

        .logo { width: min(100%, 220px); margin-bottom: 40px; }
        .code {
            margin: 0;
            color: var(--sky);
            font-size: clamp(4.5rem, 18vw, 8rem);
            font-weight: 700;
            line-height: .9;
            letter-spacing: -.08em;
        }

        h1 { margin: 28px 0 12px; font-size: clamp(1.6rem, 4vw, 2.2rem); }
        p { margin: 0 auto; max-width: 30rem; color: rgba(247,250,251,.7); line-height: 1.7; }
        .button {
            display: inline-block;
            margin-top: 32px;
            padding: 13px 22px;
            color: #fff;
            background: var(--coral);
            border-radius: 999px;
            font-size: .85rem;
            font-weight: 700;
            text-decoration: none;
        }
        .button:hover { background: var(--sky); }
    </style>
</head>
<body>
<main class="error-card">
    <a th:href="@{/}" aria-label="Volver al inicio">
        <img class="logo" th:src="@{/assets/images/fondo-letrasblancas-hexatour.png}" alt="Hexa Tours">
    </a>
    <p class="code">404</p>
    <h1>Esta página no existe</h1>
    <p>El enlace que buscas puede haber cambiado o ya no está disponible.</p>
    <a class="button" th:href="@{/}">Volver al inicio</a>
</main>
</body>
</html>
